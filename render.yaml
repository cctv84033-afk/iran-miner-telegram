services:
  - type: web
    name: iran-miner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEMO_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: 3.11.8
